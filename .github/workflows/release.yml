name: Release

# Builds the API and web images and publishes them to GitHub Container Registry.
# Trigger: push a tag like v1.0.0, or run it manually from the Actions tab.
#
# Required repository variable:   NEXT_PUBLIC_API_URL   (public URL of the API, baked into the web image)
# Optional repository variable:   NEXT_PUBLIC_CONTACT_EMAIL
# Optional repository secret:     DEPLOY_HOOK_URL       (POSTed after publishing, to trigger your host)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Require NEXT_PUBLIC_API_URL
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "Set the NEXT_PUBLIC_API_URL repository variable before releasing." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=${REGISTRY}/${owner}/devtrack-api" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${owner}/devtrack-web" >> "$GITHUB_OUTPUT"

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.api }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.web }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trigger deploy hook
        if: ${{ env.DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
